<ion-header>
  <ion-toolbar [color]="env.colorTheme === 'black'? 'black' : 'dark'">
    <ion-buttons slot="start">
      <ion-back-button text="" defaultHref="tabs/setting">
      </ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'APPEARANCE_AND_COLORS' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list-header class="ion-margin-start ion-padding-horizontal mt-1">
    <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">{{ 'APPEARANCE' | translate }}</ion-text>
  </ion-list-header>

  <ion-radio-group [(ngModel)]="env.selectedColorTheme" (ionChange)="saveColorTheme()"
    >
    <ion-item class="ion-no-padding ripple-parent" detail="false" lines="none">
      <ion-label class="ion-padding-start">
        <p class="ion-padding-horizontal pre-line">
          <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">
            {{ 'SYSTEM_DEFAULT' | translate }}
          </ion-text>
        </p>
      </ion-label>
      <ion-radio class="ion-margin-end" slot="end" [value]="'default'" [color]="'primary'">
      </ion-radio>
      <!--<ion-ripple-effect type="bounded"></ion-ripple-effect> -->
    </ion-item>
    <ion-item class="ion-no-padding ripple-parent" detail="false" lines="none">
      <ion-label class="ion-padding-start">
        <p class="ion-padding-horizontal pre-line">
          <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">
            {{ 'LIGHT' | translate }}
          </ion-text>
        </p>
      </ion-label>
      <ion-radio class="ion-margin-end" slot="end" [value]="'light'" [color]="'primary'">
      </ion-radio>
      <!--<ion-ripple-effect type="bounded"></ion-ripple-effect> -->
    </ion-item>
    <ion-item class="ion-no-padding ripple-parent" detail="false" lines="none">
      <ion-label class="ion-padding-start">
        <p class="ion-padding-horizontal pre-line">
          <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">
            {{ 'DARK' | translate }}
          </ion-text>
        </p>
      </ion-label>
      <ion-radio class="ion-margin-end" slot="end" [value]="'dark'" [color]="'primary'">
      </ion-radio>
      <!--<ion-ripple-effect type="bounded"></ion-ripple-effect> -->
    </ion-item>
    <ion-item class="ion-no-padding ripple-parent" detail="false" lines="none">
      <ion-label class="ion-padding-start">
        <p class="ion-padding-horizontal pre-line">
          <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">
            {{ 'BLACK' | translate }}
          </ion-text>
        </p>
      </ion-label>
      <ion-radio class="ion-margin-end" slot="end" [value]="'black'" [color]="'primary'">
      </ion-radio>
      <!--<ion-ripple-effect type="bounded"></ion-ripple-effect> -->
    </ion-item>
  </ion-radio-group>

  <ion-list-header class="ion-margin-start ion-padding-horizontal mt-1">
    <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">{{ 'ACCENT_COLOR' | translate }}</ion-text>
  </ion-list-header>

  <ion-radio-group [(ngModel)]="env.accentColor" (ionChange)="saveAccentColor()"
    style="margin-bottom: var(--ion-safe-area-bottom, 0);">
    <ion-item *ngFor="let accent of accentColors" button="true" detail="false" lines="none"
      (click)="env.accentColor = accent.value; saveAccentColor()">
      <span slot="start" class="accent-swatch" [style.background]="accent.hex" aria-hidden="true"></span>
      <ion-label>{{ accent.label | translate }}</ion-label>
      <ion-radio slot="end" [value]="accent.value" color="primary"></ion-radio>
    </ion-item>
  </ion-radio-group>

</ion-content>
