<ion-header>
  <ion-toolbar [color]="env.colorTheme === 'black'? 'black' : 'dark'">
    <ion-buttons slot="start"><ion-back-button text="" defaultHref="tabs/setting"></ion-back-button></ion-buttons>
    <ion-title>{{ 'SCREEN_ORIENTATION' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="qrwerk-settings-page">
  <section class="qrwerk-settings-section">
    <ion-list-header><ion-label class="qrwerk-section-title">{{ 'SCREEN_ORIENTATION' | translate }}</ion-label></ion-list-header>
    <ion-list class="qrwerk-settings-list">
      <ion-radio-group [(ngModel)]="env.orientation" (ionChange)="saveOrientation()">
        <ion-item button="true" class="qrwerk-settings-item" detail="false" lines="inset" (click)="env.orientation = 'default'; saveOrientation()">
          <ion-label><h2>{{ 'SYSTEM_DEFAULT' | translate }}</h2></ion-label>
          <ion-radio slot="end" value="default" color="primary"></ion-radio>
        </ion-item>
        <ion-item button="true" class="qrwerk-settings-item" detail="false" lines="inset" (click)="env.orientation = 'portrait'; saveOrientation()">
          <ion-label><h2>{{ 'LOCK_PORTRAIT' | translate }}</h2></ion-label>
          <ion-radio slot="end" value="portrait" color="primary"></ion-radio>
        </ion-item>
        <ion-item button="true" class="qrwerk-settings-item" detail="false" lines="none" (click)="env.orientation = 'landscape'; saveOrientation()">
          <ion-label><h2>{{ 'LOCK_LANDSCAPE' | translate }}</h2></ion-label>
          <ion-radio slot="end" value="landscape" color="primary"></ion-radio>
        </ion-item>
      </ion-radio-group>
    </ion-list>
  </section>
</ion-content>
