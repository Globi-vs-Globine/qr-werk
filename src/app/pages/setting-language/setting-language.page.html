<ion-header>
  <ion-toolbar [color]="env.colorTheme === 'black'? 'black' : 'dark'">
    <ion-buttons slot="start">
      <ion-back-button text="" defaultHref="tabs/setting"> </ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'LANGUAGE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="qrwerk-standard-page">
  <ion-list-header class="ion-margin-start ion-padding-horizontal mt-1">
    <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">{{ 'LANGUAGE' | translate }}</ion-text>
  </ion-list-header>

  <ion-radio-group [(ngModel)]="env.selectedLanguage" (ionChange)="saveLanguage()">
    <ion-item class="ion-no-padding ripple-parent" detail="false" lines="none">
      <ion-label class="ion-padding-start">
        <p class="ion-padding-horizontal pre-line">
          <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">
            {{ 'SYSTEM_DEFAULT' | translate }}
          </ion-text>
        </p>
      </ion-label>
      <ion-radio class="ion-margin-end" slot="end" [value]="'default'" [color]="'primary'">
      </ion-radio>
    </ion-item>
    <ion-item class="ion-no-padding ripple-parent" detail="false" lines="none">
      <ion-label class="ion-padding-start">
        <p class="ion-padding-horizontal pre-line">
          <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">
            Deutsch (de)
          </ion-text>
        </p>
      </ion-label>
      <ion-radio class="ion-margin-end" slot="end" [value]="'de'" [color]="'primary'">
      </ion-radio>
    </ion-item>
    <ion-item class="ion-no-padding ripple-parent" detail="false" lines="none">
      <ion-label class="ion-padding-start">
        <p class="ion-padding-horizontal pre-line">
          <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">
            English (en)
          </ion-text>
        </p>
      </ion-label>
      <ion-radio class="ion-margin-end" slot="end" [value]="'en'" [color]="'primary'">
      </ion-radio>
    </ion-item>
    <ion-item class="ion-no-padding ripple-parent" detail="false" lines="none">
      <ion-label class="ion-padding-start">
        <p class="ion-padding-horizontal pre-line">
          <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">
            Français (fr)
          </ion-text>
        </p>
      </ion-label>
      <ion-radio class="ion-margin-end" slot="end" [value]="'fr'" [color]="'primary'">
      </ion-radio>
    </ion-item>
    <ion-item class="ion-no-padding ripple-parent" detail="false" lines="none">
      <ion-label class="ion-padding-start">
        <p class="ion-padding-horizontal pre-line">
          <ion-text [color]="env.colorTheme === 'light'? 'dark' : 'light'">
            Italiano (it)
          </ion-text>
        </p>
      </ion-label>
      <ion-radio class="ion-margin-end" slot="end" [value]="'it'" [color]="'primary'">
      </ion-radio>
    </ion-item>
  </ion-radio-group>
</ion-content>
